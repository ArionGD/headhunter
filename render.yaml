services:
  - type: web
    name: headhunt-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi
    envVars:
      - key: APOLLO_API_KEY
        sync: false
        placeholder: "Your Apollo.io API Key"
      - key: SNOV_CLIENT_ID
        sync: false
        placeholder: "Your Snov.io Client ID (API User ID)"
      - key: SNOV_CLIENT_SECRET
        sync: false
        placeholder: "Your Snov.io Client Secret (API Secret)"

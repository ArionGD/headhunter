{% extends "base.html" %}

{% block title %}Log In — Hunter.io Greenera Farms{% endblock %}

{% block content %}
<div class="relative overflow-hidden pt-12 pb-24">
    <!-- Ambient Glow Orbs -->
    <div class="absolute top-10 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-600/15 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative z-10 max-w-md mx-auto px-4 sm:px-6">
        <div class="backdrop-blur-2xl bg-white/85 border border-slate-200/80 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white font-extrabold text-xl shadow-md mx-auto mb-2">
                    H
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h1>
                <p class="text-xs text-slate-500">Sign in to access your HeadHunt.io Master CRM dashboard.</p>
            </div>

            <form action="#" method="POST" class="space-y-4" onsubmit="event.preventDefault(); window.location.href='{% url 'dashboard' %}';">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email Address</label>
                    <input type="email" placeholder="admin@greenerafarms.org" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-semibold text-slate-600 uppercase">Password</label>
                        <a href="#" onclick="alert('Password reset link has been sent to your email address.'); return false;" class="text-[11px] font-semibold text-amber-600 hover:underline">Forgot?</a>
                    </div>
                    <input type="password" placeholder="••••••••" required class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-amber-600 hover:from-blue-700 hover:to-amber-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-blue-600/20 hover:shadow-lg transition-all text-sm mt-2">
                    Log In to Dashboard
                </button>
            </form>

            <div class="text-center pt-2 border-t border-slate-100">
                <p class="text-xs text-slate-500">
                    Don't have an account? 
                    <a href="{% url 'signup' %}" class="font-bold text-amber-600 hover:underline">Create Account &rarr;</a>
                </p>
            </div>

        </div>
    </div>
</div>
{% endblock %}

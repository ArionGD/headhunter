<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Developer Admin Panel — HeadHunt.io{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; }
        h1, h2, h3, h4, .font-heading { font-family: 'Outfit', sans-serif; }
        .sidebar-collapsed { width: 4.5rem !important; }
        .sidebar-collapsed .sidebar-text { display: none !important; }
        .sidebar-collapsed .sidebar-header-text { display: none !important; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-200">

    <!-- ENTERPRISE DARK HEADER BAR -->
    <header class="sticky top-0 z-40 bg-[#0f172a] border-b border-slate-800/80 text-white shadow-md">
        <div class="w-full px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            
            <!-- Logo & Brand -->
            <div class="flex items-center gap-3">
                <a href="{% url 'home' %}" class="flex items-center gap-3 group">
                    <svg width="36" height="36" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" class="group-hover:scale-105 transition-transform">
                      <defs>
                        <linearGradient id="hh_app_blue_gold" x1="0" y1="0" x2="1" y2="1">
                          <stop offset="0%" stop-color="#2563eb"/>
                          <stop offset="100%" stop-color="#1e40af"/>
                        </linearGradient>
                        <linearGradient id="hh_app_gold_lines" x1="0" y1="0" x2="1" y2="1">
                          <stop offset="0%" stop-color="#fb923c"/>
                          <stop offset="100%" stop-color="#f59e0b"/>
                        </linearGradient>
                      </defs>
                      <rect width="44" height="44" rx="12" fill="url(#hh_app_blue_gold)"/>
                      <g transform="translate(10 10)" fill="none" stroke="url(#hh_app_gold_lines)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4l3.2 3.2M20 4l-3.2 3.2"/>
                        <path d="M4 4c0 6.2 1.6 10.4 8 15 6.4-4.6 8-8.8 8-15"/>
                        <circle cx="9.4" cy="11" r="1" fill="#f59e0b" stroke="none"/>
                        <circle cx="14.6" cy="11" r="1" fill="#f59e0b" stroke="none"/>
                        <path d="M12 14.4l-1.2-1h2.4z" fill="#f59e0b" stroke="none"/>
                      </g>
                    </svg>
                    <div class="leading-tight">
                        <p class="text-base font-extrabold text-white tracking-tight">Hunter<span class="text-amber-400">.io</span></p>
                        <p class="text-[10px] text-amber-300 font-semibold -mt-0.5 uppercase tracking-wider">Control Panel</p>
                    </div>
                </a>
            </div>

            <!-- Center Breadcrumbs & Search -->
            <div class="hidden md:flex items-center gap-6 flex-1 max-w-xl mx-auto">
                <div class="text-xs text-slate-400 font-medium">
                    <span>Admin</span> &gt; <span class="text-white font-bold">{% block breadcrumb %}Control Panel{% endblock %}</span>
                </div>
                <div class="relative flex-1">
                    <input type="text" placeholder="Search users, profiles, leads..." 
                           class="w-full bg-[#1e293b]/80 border border-slate-700/70 rounded-xl px-4 py-1.5 pl-9 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 absolute left-3 top-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </div>
            </div>

            <!-- Right Header Actions -->
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline-flex items-center gap-1.5 bg-blue-600/20 text-blue-300 border border-blue-500/40 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                    ADMIN CONSOLE
                </span>

                <div class="flex items-center gap-2 border-l border-slate-800 pl-3">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-extrabold text-xs flex items-center justify-center shadow-md">
                        A
                    </div>
                </div>
            </div>

        </div>
    </header>

    <!-- CONTROL PANEL CONTAINER -->
    <div class="flex-1 w-full flex overflow-hidden">

        <!-- LEFT SIDEBAR CONTROL PANEL -->
        <aside id="sidebar" class="w-64 bg-[#0f172a] border-r border-slate-800/80 flex flex-col justify-between transition-all duration-300 flex-shrink-0 z-30">
            
            <div class="p-4 space-y-6">
                <p class="sidebar-header-text text-[10px] font-extrabold text-slate-500 uppercase tracking-widest px-2">Navigation</p>

                <nav class="space-y-1.5 text-xs font-semibold">
                    
                    <!-- 1. Overview -->
                    <a href="{% url 'home' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all text-slate-400 hover:bg-[#1e293b] hover:text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                        <span class="sidebar-text">Overview</span>
                    </a>

                    <!-- 2. Search People -->
                    <a href="{% url 'dashboard' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                       {% if request.resolver_match.url_name == 'dashboard' %}
                           bg-blue-600 text-white font-bold shadow-md shadow-blue-600/30
                       {% else %}
                           text-slate-400 hover:bg-[#1e293b] hover:text-white
                       {% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-blue-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <span class="sidebar-text">Search People</span>
                    </a>

                    <!-- 3. CRM Pipeline -->
                    <a href="{% url 'crm' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                       {% if request.resolver_match.url_name == 'crm' %}
                           bg-emerald-600 text-white font-bold shadow-md shadow-emerald-600/30
                       {% else %}
                           text-slate-400 hover:bg-[#1e293b] hover:text-white
                       {% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-emerald-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        <span class="sidebar-text">CRM Pipeline</span>
                    </a>

                    <!-- 4. Master DB -->
                    <a href="{% url 'master' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                       {% if request.resolver_match.url_name == 'master' %}
                           bg-indigo-600 text-white font-bold shadow-md shadow-indigo-600/30
                       {% else %}
                           text-slate-400 hover:bg-[#1e293b] hover:text-white
                       {% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-indigo-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
                        <span class="sidebar-text">Master DB</span>
                    </a>

                </nav>
            </div>

            <!-- BOTTOM ACTIONS: LOGOUT & COLLAPSE SIDEBAR -->
            <div class="p-4 border-t border-slate-800/80 space-y-2 text-xs font-semibold">
                
                <!-- Logout -->
                <a href="{% url 'logout' %}" class="flex items-center gap-3 px-3 py-2.5 text-rose-400 hover:bg-rose-950/40 hover:text-rose-300 rounded-xl transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-rose-500 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="sidebar-text">Logout</span>
                </a>

                <!-- Collapse / Expand Sidebar -->
                <button id="toggle-sidebar-btn" class="w-full flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:bg-[#1e293b] hover:text-white rounded-xl transition-all">
                    <svg id="collapse-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
                    <span class="sidebar-text" id="toggle-text">Collapse Sidebar</span>
                </button>

            </div>

        </aside>

        <!-- RIGHT MAIN WORKSPACE CONTENT AREA -->
        <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-[#0b0f19]">
            {% block app_content %}{% endblock %}
        </main>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const sidebar = document.getElementById("sidebar");
            const toggleBtn = document.getElementById("toggle-sidebar-btn");
            const toggleText = document.getElementById("toggle-text");

            toggleBtn.addEventListener("click", function() {
                sidebar.classList.toggle("sidebar-collapsed");
                if (sidebar.classList.contains("sidebar-collapsed")) {
                    toggleText.textContent = "Expand";
                } else {
                    toggleText.textContent = "Collapse Sidebar";
                }
            });
        });
    </script>

</body>
</html>

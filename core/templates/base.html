{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Greenera Farms — Hunter.io{% endblock %}</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/fox_favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'images/fox_favicon.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/fox_favicon.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
        .leaf-bg {
            background-image: radial-gradient(circle at 10% 20%, rgba(37,99,235,0.07), transparent 42%),
                               radial-gradient(circle at 90% 80%, rgba(249,115,22,0.06), transparent 42%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 99, 235, 0.12);
        }
        .card-enter {
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="leaf-bg bg-slate-50 min-h-screen text-slate-800 flex flex-col">
    {% include "partial/navbar.html" %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% include "partial/footer.html" %}

    {% block extra_scripts %}{% endblock %}
</body>
</html>

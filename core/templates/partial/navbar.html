            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-blue-700 text-orange-400 flex items-center justify-center shadow-sm shadow-blue-600/25 group-hover:from-blue-700 group-hover:to-blue-800 transition-all">

                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">

                <p class="text-[11px] text-slate-500 font-medium -mt-0.5 tracking-wide uppercase">Greenera Farms</p>

        <nav class="hidden md:flex items-center gap-1.5 absolute left-1/2 -translate-x-1/2">

        <!-- CTA (right) -->
        <div class="flex items-center gap-2 flex-shrink-0">
